  <h1>グラフ</h1>

  <!-- ① 種目別の重量推移 -->
  <div class="card">
    <h2>種目別の重量推移</h2>
    <select id="graphExerciseSelect"></select>
    <canvas id="weightChart"></canvas>
  </div>

  <!-- ② 総ボリュームの推移 -->
  <div class="card">
    <h2>トレ量（総ボリューム）の推移</h2>
    <p style="color:#888; font-size:13px;">重量×回数の合計（直近14日）</p>
    <canvas id="volumeChart"></canvas>
  </div>

  <!-- 消費カロリーの推移 -->
  <div class="card">
    <h2>消費カロリーの推移</h2>
    <p style="color:#888; font-size:13px;">カロリー計算をした日が記録されます（直近14日）</p>
    <canvas id="calorieChart"></canvas>
  </div>

  <script src="script.js"></script>
