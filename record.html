<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>記録</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0E15">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

  <!-- ============================================================= -->
  <!--  ページ内タブ（3つのパネルを切り替える）                      -->
  <!-- ============================================================= -->
  <div class="rec-tabs">
    <button type="button" class="rec-tab active" data-panel="panelMenu" onclick="switchRecPanel(this)">
      今日のメニュー<span class="rec-badge" id="recMenuBadge"></span>
    </button>
    <button type="button" class="rec-tab" data-panel="panelInput" onclick="switchRecPanel(this)">
      記録する
    </button>
    <button type="button" class="rec-tab" data-panel="panelAI" onclick="switchRecPanel(this)">
      AI提案
    </button>
  </div>

  <!-- ============================================================= -->
  <!--  パネル1：今日のメニュー                                      -->
  <!-- ============================================================= -->
  <section class="rec-panel active" id="panelMenu">

    <div class="card">
      <h2>今日のメニュー</h2>

      <ul id="menuList"></ul>

      <button class="sub-btn" onclick="clearTodayMenu()">
        今日のメニューをクリア
      </button>
    </div>

    <div class="card">
      <details>
        <summary>前回のトレ・保存メニュー</summary>

        <button onclick="loadLastSession()">
          ↻ 前回のトレを読み込む
        </button>

        <button class="sub-btn" onclick="saveLastSession()">
          今日のトレを「前回」として記憶
        </button>

        <div class="ai-divider"></div>

        <input id="menuName" placeholder="メニュー名（例：胸の日）">

        <button onclick="saveRoutine()">
          今日のメニューに名前を付けて保存
        </button>

        <div id="routineButtons"></div>
      </details>
    </div>

  </section>

  <!-- ============================================================= -->
  <!--  パネル2：記録する                                            -->
  <!-- ============================================================= -->
  <section class="rec-panel" id="panelInput">

    <div class="card">

      <label>種目</label>

      <input id="recSearch" type="search" placeholder="種目名で検索" oninput="updateExerciseSelect()">

      <div id="recPartTabs" class="filter-tabs">
        <button type="button" class="filter-tab active" data-part="all" onclick="setRecPart(this)">すべて</button>
        <button type="button" class="filter-tab" data-part="胸" onclick="setRecPart(this)">胸</button>
        <button type="button" class="filter-tab" data-part="背中" onclick="setRecPart(this)">背中</button>
        <button type="button" class="filter-tab" data-part="肩" onclick="setRecPart(this)">肩</button>
        <button type="button" class="filter-tab" data-part="脚" onclick="setRecPart(this)">脚</button>
        <button type="button" class="filter-tab" data-part="腕" onclick="setRecPart(this)">腕</button>
        <button type="button" class="filter-tab" data-part="腹筋" onclick="setRecPart(this)">腹筋</button>
        <button type="button" class="filter-tab" data-part="有酸素" onclick="setRecPart(this)">有酸素</button>
        <button type="button" class="filter-tab" data-part="その他" onclick="setRecPart(this)">その他</button>
      </div>

      <select id="exerciseSelect"></select>

      <div id="previousWeight"></div>

      <label>重量(kg)</label>
      <div class="field-row">
        <button type="button" class="step-btn" onclick="stepField('exerciseWeight', -2.5, 0)">−</button>
        <input id="exerciseWeight" type="number" inputmode="decimal">
        <button type="button" class="step-btn" onclick="stepField('exerciseWeight', 2.5, 0)">＋</button>
      </div>

      <label>回数</label>
      <div class="field-row">
        <button type="button" class="step-btn" onclick="stepField('exerciseReps', -1, 0)">−</button>
        <input id="exerciseReps" type="number" inputmode="numeric">
        <button type="button" class="step-btn" onclick="stepField('exerciseReps', 1, 0)">＋</button>
      </div>

      <label>セット数</label>
      <div class="field-row">
        <button type="button" class="step-btn" onclick="stepField('exerciseSets', -1, 1)">−</button>
        <input id="exerciseSets" type="number" inputmode="numeric" value="3">
        <button type="button" class="step-btn" onclick="stepField('exerciseSets', 1, 1)">＋</button>
      </div>

      <button onclick="addWorkout()">
        この内容で記録する
      </button>

      <div id="recordMsg" class="ai-add-msg"></div>

      <div class="ai-divider"></div>

      <details class="ai-card">
        <summary>＋ リストに無い種目をここで追加</summary>

        <input id="newExerciseName" placeholder="種目名">

        <label>部位</label>
        <select id="newExercisePart">
          <option value="胸">胸</option>
          <option value="背中">背中</option>
          <option value="肩">肩</option>
          <option value="脚">脚</option>
          <option value="腕">腕</option>
          <option value="腹筋">腹筋</option>
          <option value="有酸素">有酸素</option>
          <option value="その他">その他</option>
        </select>

        <input id="newExerciseMets" type="number" inputmode="decimal"
          placeholder="METs（例：5）">

        <button onclick="addExercise()">追加してリストに反映</button>
      </details>

    </div>

  </section>

  <!-- ============================================================= -->
  <!--  パネル3：AIメニュー提案                                      -->
  <!-- ============================================================= -->
  <section class="rec-panel" id="panelAI">

    <div class="card ai-card">

      <h2>🤖 AIにメニューを提案してもらう</h2>

      <div class="ai-group-title">🎯 目的</div>
      <div class="chip-row">
        <label class="chip"><input type="radio" name="aiPurpose" value="ダイエット"><span>ダイエット</span></label>
        <label class="chip"><input type="radio" name="aiPurpose" value="見た目改善" checked><span>見た目改善</span></label>
        <label class="chip"><input type="radio" name="aiPurpose" value="筋力向上"><span>筋力向上</span></label>
        <label class="chip"><input type="radio" name="aiPurpose" value="健康維持"><span>健康維持</span></label>
      </div>

      <div class="ai-group-title">📈 レベル</div>
      <div class="ai-note">種目の選び方とセット数に反映されます（初心者ほど扱いやすい種目を優先）</div>
      <div class="chip-row">
        <label class="chip"><input type="radio" name="aiLevel" value="初心者" checked><span>初心者</span></label>
        <label class="chip"><input type="radio" name="aiLevel" value="中級者"><span>中級者</span></label>
        <label class="chip"><input type="radio" name="aiLevel" value="上級者"><span>上級者</span></label>
      </div>

      <div class="ai-group-title">🏋️ 部位（複数選択）</div>
      <div class="ai-note">未選択のときは全身バランスで提案します</div>
      <div class="chip-row">
        <label class="chip"><input type="checkbox" name="aiPart" value="胸"><span>胸</span></label>
        <label class="chip"><input type="checkbox" name="aiPart" value="背中"><span>背中</span></label>
        <label class="chip"><input type="checkbox" name="aiPart" value="肩"><span>肩</span></label>
        <label class="chip"><input type="checkbox" name="aiPart" value="脚"><span>脚</span></label>
        <label class="chip"><input type="checkbox" name="aiPart" value="腕"><span>腕</span></label>
        <label class="chip"><input type="checkbox" name="aiPart" value="腹筋"><span>腹筋</span></label>
      </div>

      <div class="ai-group-title">📋 種目数</div>
      <div class="chip-row">
        <label class="chip"><input type="radio" name="aiCount" value="2"><span>2</span></label>
        <label class="chip"><input type="radio" name="aiCount" value="3"><span>3</span></label>
        <label class="chip"><input type="radio" name="aiCount" value="4" checked><span>4</span></label>
        <label class="chip"><input type="radio" name="aiCount" value="5"><span>5</span></label>
        <label class="chip"><input type="radio" name="aiCount" value="6"><span>6</span></label>
      </div>

      <div class="ai-group-title">🕐 所要時間（分）</div>
      <div class="chip-row">
        <label class="chip"><input type="radio" name="aiTime" value="15"><span>15</span></label>
        <label class="chip"><input type="radio" name="aiTime" value="30" checked><span>30</span></label>
        <label class="chip"><input type="radio" name="aiTime" value="45"><span>45</span></label>
        <label class="chip"><input type="radio" name="aiTime" value="60"><span>60</span></label>
        <label class="chip"><input type="radio" name="aiTime" value="90"><span>90</span></label>
      </div>

      <div class="ai-divider"></div>

      <label class="ai-option">
        <input type="checkbox" id="aiOmakase">
        AIにおまかせ（部位を選ばず全身バランスで提案）
      </label>

      <button onclick="generateAIMenu()">AIにメニューを提案してもらう</button>

    </div>

    <!-- AI提案結果（チェックして今日のメニューに保存） -->
    <div class="card ai-card" id="aiResult">
      <p class="ai-note">上のボタンを押すと、ここに提案メニューが表示されます。</p>
    </div>

  </section>

  <script src="script.js"></script>
  <script src="ai.js"></script>

  <script>
    // ===== ページ内タブの切り替え =====
    function switchRecPanel(btn) {

      const id = btn.dataset.panel;

      document.querySelectorAll(".rec-panel").forEach(p => {
        p.classList.toggle("active", p.id === id);
      });

      document.querySelectorAll(".rec-tab").forEach(b => {
        b.classList.toggle("active", b === btn);
      });

      // 最後に開いていたタブを覚えておく
      localStorage.setItem("recPanel", id);

      window.scrollTo({ top: 0 });
    }

    // ===== タブのバッジ（今日のメニューの種目数）=====
    function updateRecTabBadge() {

      const el = document.getElementById("recMenuBadge");
      if (!el) return;

      let n = 0;
      try {
        const menu = JSON.parse(localStorage.getItem("todayMenu") || "[]");
        n = new Set(menu.map(it => it.name)).size;
      } catch (e) { /* 壊れたデータは無視 */ }

      el.textContent = n > 0 ? n : "";
    }

    // メニューが再描画されるたびにバッジも更新する
    // （script.js 側は触らずに、ここで包んでいる）
    const _renderMenu = renderMenu;
    renderMenu = function () {
      _renderMenu.apply(this, arguments);
      updateRecTabBadge();
    };

    // script.js の window.onload が終わったあとに実行される
    window.addEventListener("load", () => {

      const saved = localStorage.getItem("recPanel");
      const btn = document.querySelector('.rec-tab[data-panel="' + saved + '"]');
      if (btn) switchRecPanel(btn);

      updateRecTabBadge();
    });
  </script>

    <a href="record.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.8 3.7l3.5 3.5L8 19.5l-4.5 1 1-4.5z"/></svg></span>記録</a>

    <a href="calorie.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c.8 3-4.5 5.2-4.5 9a4.5 4.5 0 0 0 9 .2c0-1.9-.9-3.2-1.9-4.2-.2 1.3-.9 1.9-1.6 2.1.6-2.3-.2-5.1-1-7.1z"/></svg></span>カロリー</a>
    <a href="graph.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4v16h16"/><path d="M8 15.5l3.2-4 3 2.2 4.8-6.2"/></svg></span>グラフ</a>
  </nav>

</body>
</html>
