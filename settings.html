  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <meta name="theme-color" content="#0B0E15">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

  <h1>その他・設定</h1>

  <!-- レストタイマーの設定 -->
  <div class="card">
    <h2>レストタイマー</h2>

    <label>音量：<span id="volumeLabel"></span></label>
    <input id="setVolume" type="range" min="0" max="100" step="5"
      oninput="onVolumeInput()" onchange="playSound()">
    <p class="note">スライダーを離すとテスト音が鳴ります。</p>

    <label class="toggle-row">
      <span>終了音を鳴らす</span>
      <input id="setSoundOn" type="checkbox" onchange="onToggle('soundOn', this)">
    </label>

    <label class="toggle-row">
      <span>バイブレーション</span>
      <input id="setVibrateOn" type="checkbox" onchange="onToggle('vibrateOn', this)">
    </label>

    <div class="ai-divider"></div>

    <label>デフォルトのセット間レスト（秒）</label>
    <div class="field-row">
      <button type="button" class="step-btn" onclick="stepSetting('defaultSetRest','setDefaultSetRest',-15,0)">−</button>
      <input id="setDefaultSetRest" type="number" inputmode="numeric" onchange="onNumberSetting('defaultSetRest', this)">
      <button type="button" class="step-btn" onclick="stepSetting('defaultSetRest','setDefaultSetRest',15,0)">＋</button>
    </div>

    <label>デフォルトの種目間レスト（秒）</label>
    <div class="field-row">
      <button type="button" class="step-btn" onclick="stepSetting('defaultExRest','setDefaultExRest',-15,0)">−</button>
      <input id="setDefaultExRest" type="number" inputmode="numeric" onchange="onNumberSetting('defaultExRest', this)">
      <button type="button" class="step-btn" onclick="stepSetting('defaultExRest','setDefaultExRest',15,0)">＋</button>
    </div>
    <p class="note">タイマー画面を開いたときの初期値になります（種目ごとの保存があればそちら優先）。</p>
  </div>

  <!-- 実績バッジ -->
  <div class="card">
    <h2>実績</h2>
    <div id="badgeBox" class="badge-grid"></div>
  </div>

  <!-- データ管理 -->
  <div class="card">
    <h2>データ管理</h2>

    <div id="backupReminder" class="backup-reminder" style="display:none;"></div>

    <p class="note">
      記録は端末内に保存されます。端末やブラウザを変える前に、バックアップを保存しておくと安心です。
    </p>

    <button onclick="exportData()">バックアップを保存</button>

    <label>バックアップを読み込む</label>
    <input type="file" accept="application/json" onchange="importData(this)">

    <div class="ai-divider"></div>

    <button class="btn-stop" onclick="resetAllData()">すべてのデータを消去</button>
    <p class="note">記録・種目・設定をすべて削除します（取り消せません）。</p>
  </div>
