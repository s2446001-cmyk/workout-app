<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>タイマー</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0E15">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

  

  <h1>タイマー</h1>

  <div class="card">

    <label>種目を選ぶ（メニューから）</label>
    <select id="timerExercise" onchange="onTimerExerciseChange()"></select>
    <p class="note" id="timerExerciseNote">種目を選ぶと、その種目に保存したレスト時間が呼び出されます。</p>

    <label>セット数</label>
    <div class="field-row">
      <button type="button" class="step-btn" onclick="stepField('totalSets', -1, 1)">−</button>
      <input id="totalSets" type="number" inputmode="numeric" value="3">
      <button type="button" class="step-btn" onclick="stepField('totalSets', 1, 1)">＋</button>
    </div>

    <label>セット間レスト（秒）</label>
    <div class="field-row">
      <button type="button" class="step-btn" onclick="stepField('setRest', -15, 0); saveTimerRest()">−</button>
      <input id="setRest" type="number" inputmode="numeric" value="60" onchange="saveTimerRest()">
      <button type="button" class="step-btn" onclick="stepField('setRest', 15, 0); saveTimerRest()">＋</button>
    </div>

    <label>種目間レスト（秒）</label>
    <div class="field-row">
      <button type="button" class="step-btn" onclick="stepField('exerciseRest', -15, 0); saveTimerRest()">−</button>
      <input id="exerciseRest" type="number" inputmode="numeric" value="120" onchange="saveTimerRest()">
      <button type="button" class="step-btn" onclick="stepField('exerciseRest', 15, 0); saveTimerRest()">＋</button>
    </div>

    <button id="setRestBtn" class="btn-set-rest" onclick="startSetRest()">
      セット完了 → 休憩
    </button>

    <button id="exerciseRestBtn" class="btn-ex-rest" onclick="startExerciseRest()">
      種目完了 → 休憩
    </button>

    <button class="btn-stop" onclick="stopTimer()">
      ストップ
    </button>

    <button class="btn-muted" onclick="stopSound()">
      音を止める
    </button>

    <button class="btn-muted" onclick="playSound()">
      音確認
    </button>

  </div>

  <div class="card">

    <h2 id="setDisplay">
      0 / 0 セット完了
    </h2>

    <div class="timer-ring" id="timerRing" style="--p:0">
      <h1 id="timer">
        待機中
      </h1>
    </div>

  </div>

  <script src="script.js"></script>

    <a href="record.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.8 3.7l3.5 3.5L8 19.5l-4.5 1 1-4.5z"/></svg></span>記録</a>
