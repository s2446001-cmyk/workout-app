<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>筋トレサポートアプリ</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0E15">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

  

  <h1>筋トレサポートアプリ</h1>

  <!-- レベル（ホームのトップに表示） -->
  <div class="card">
    <h2>レベル</h2>
    <div id="levelBox"></div>
  </div>

  <!-- 今週のトレーニング・連続記録 -->
  <div class="card">
    <h2>今週のトレーニング</h2>

    <div id="weeklyStreakBox"></div>
  </div>

  <div class="card">
    <h2>初心者の筋トレ継続をサポート</h2>

    <p>
      セット管理・レスト管理・記録・
      カロリー計算を簡単にします
    </p>
  </div>

  <!-- データのバックアップ／復元 -->
  <div class="card">
    <h2>データ管理</h2>

    <p class="note">
      記録のバックアップと復元ができます。
      端末やブラウザを変える前に保存しておくと安心です。
    </p>

    <button onclick="exportData()">
      バックアップを保存
    </button>

    <label>バックアップを読み込む</label>
    <input type="file" accept="application/json" onchange="importData(this)">
  </div>

  <script src="script.js"></script>

  <nav class="bottom-nav">

    <a href="timer.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M9.5 3h5"/></svg></span>タイマー</a>
    <a href="record.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.8 3.7l3.5 3.5L8 19.5l-4.5 1 1-4.5z"/></svg></span>記録</a>
    <a href="exercise.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10v4M6.5 7.5v9M17.5 7.5v9M20.5 10v4M6.5 12h11"/></svg></span>種目</a>
    <a href="calorie.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c.8 3-4.5 5.2-4.5 9a4.5 4.5 0 0 0 9 .2c0-1.9-.9-3.2-1.9-4.2-.2 1.3-.9 1.9-1.6 2.1.6-2.3-.2-5.1-1-7.1z"/></svg></span>カロリー</a>
    <a href="graph.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4v16h16"/><path d="M8 15.5l3.2-4 3 2.2 4.8-6.2"/></svg></span>グラフ</a>
  </nav>

</body>
</html>
