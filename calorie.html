<body>

  

  <h1>カロリー計算</h1>

  <div class="card">

    <p class="note">
      今日のメニューと身長・体重から、だいたいの消費カロリーを計算します。
    </p>

    <label>体重(kg)</label>
    <div class="field-row">
      <button type="button" class="step-btn"
        onclick="stepField('weight', -0.5, 20); saveBodyStats()">−</button>
      <input id="weight" type="number" inputmode="decimal"
        onchange="saveBodyStats()">
      <button type="button" class="step-btn"
        onclick="stepField('weight', 0.5, 20); saveBodyStats()">＋</button>
    </div>

    <label>身長(cm)</label>
    <div class="field-row">
      <button type="button" class="step-btn"
        onclick="stepField('height', -0.5, 100); saveBodyStats()">−</button>
      <input id="height" type="number" inputmode="decimal"
        onchange="saveBodyStats()">
      <button type="button" class="step-btn"
        onclick="stepField('height', 0.5, 100); saveBodyStats()">＋</button>
    </div>

    <button onclick="calcFromMenu()">
      今日のメニューから計算
    </button>

    <p id="result"></p>

  </div>

  <script src="script.js"></script>
